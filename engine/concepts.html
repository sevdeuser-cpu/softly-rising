<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Cinzel";font-weight:600;src:url("../node_modules/@fontsource/cinzel/files/cinzel-latin-600-normal.woff2")}
@font-face{font-family:"Cormorant";font-weight:600;src:url("../node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-600-normal.woff2")}
@font-face{font-family:"Cormorant";font-weight:500;font-style:italic;src:url("../node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-italic.woff2")}
@font-face{font-family:"Jost";font-weight:400;src:url("../node_modules/@fontsource/jost/files/jost-latin-400-normal.woff2")}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1760px;height:1110px;background:#222;display:flex;gap:26px;padding:28px;font-family:Jost}
.col{width:540px}.cap{color:#eee;font:400 26px Jost;margin-bottom:12px}.cap small{display:block;color:#aaa;font-size:18px;margin-top:4px}
svg.p{width:540px;height:960px;border-radius:16px;display:block}
.line *{fill:none!important;stroke:#f6d49a!important;stroke-width:1.3!important}
</style></head><body>
<div class="col"><div class="cap">A · Paper Cut<small>Katmanlı kâğıt kesik diorama · gölgeli derinlik · kâğıt dokusu</small></div><svg class="p" id="A" viewBox="0 0 1080 1920"></svg></div>
<div class="col"><div class="cap">B · Living Tarot<small>Her madde canlanan bir tarot kartı · kart dönerek geçiş</small></div><svg class="p" id="B" viewBox="0 0 1080 1920"></svg></div>
<div class="col"><div class="cap">C · Gold Ink Star Chart<small>Canlı çizilen altın mürekkep · yıldız haritası ızgarası</small></div><svg class="p" id="C" viewBox="0 0 1080 1920"></svg></div>
<script src="lib_draw.js"></script><script>
const t=3.2;
const paperTex=(id,op)=>`<filter id="${id}"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="4"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 ${op}"/></feComponentTransfer><feComposite in2="SourceGraphic" operator="in"/><feBlend in2="SourceGraphic" mode="multiply"/></filter>`;
const shadow=`<filter id="sh" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#1a0818" flood-opacity=".55"/></filter>`;
// ---------- A: PAPER CUT ----------
(function(){
  const wav=(y,amp,seed,col,id)=>{let d=`M-20,1920 L-20,${y}`;for(let x=-20;x<=1100;x+=36){d+=` L${x},${y-amp*(.5+.5*Math.sin(x*.012+seed))+Math.sin(x*.21+seed)*4}`}return `<path d="${d} L1100,1920Z" fill="${col}" filter="url(#sh)"/>`};
  let s=`<defs>${shadow}${paperTex('pt',.35)}</defs><g filter="url(#pt)"><rect width="1080" height="1920" fill="#f1b48f"/>`;
  [["#d97a74",0,1500],["#b05a6e",180,1300],["#7e3f63",380,1100],["#56294f",620,900]].forEach(([c,y,h])=>{s+=`<path d="M0,0 L1080,0 L1080,${1920-h-y} Q540,${1980-h-y} 0,${1920-h-y}Z" fill="${c}" filter="url(#sh)" transform="translate(0,${-y*0})"/>`});
  // paper sun with cut rays
  s+=`<g filter="url(#sh)">`;for(let k=0;k<12;k++){const a=k/12*Math.PI*2;s+=`<path transform="translate(540,640) rotate(${k*30+t*4})" d="M-16,-150 L0,-215 L16,-150Z" fill="#ffd27a"/>`}
  s+=`<circle cx="540" cy="640" r="130" fill="#ffc35a"/><circle cx="540" cy="640" r="96" fill="#ffd98a"/></g>`;
  s+=wav(1240,130,1,"#c06f86")+wav(1330,100,3,"#9a4f74")+wav(1420,70,5,"#743a60")+`<path d="M0,1500 Q540,1460 1080,1500 L1080,1920 L0,1920Z" fill="#4e2547" filter="url(#sh)"/>`;
  s+=`<g filter="url(#sh)">${woman(540,1080,1.7,{la:120,ra:120,look:10},t)}</g></g>`;
  s+=`<g filter="url(#sh)"><path d="M250,190 L830,190 L800,250 L830,310 L250,310 L280,250Z" fill="#fff6ea"/></g><text x="540" y="270" text-anchor="middle" font-family="Cinzel" font-weight="600" font-size="78" fill="#7e3f63">SUNDAY</text>`;
  s+=`<text x="540" y="1650" text-anchor="middle" font-family="Cormorant" font-weight="600" font-size="70" fill="#fff6ea" style="paint-order:stroke" stroke="#4e2547" stroke-width="10">You were born to be seen.</text>`;
  document.getElementById('A').innerHTML=s;
})();
// ---------- B: LIVING TAROT ----------
(function(){
  let s=`<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1633"/><stop offset="1" stop-color="#4a2445"/></linearGradient>
   <linearGradient id="cardsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d1d44"/><stop offset=".55" stop-color="#a04a66"/><stop offset=".78" stop-color="#f08f72"/><stop offset="1" stop-color="#ffd0a0"/></linearGradient>
   <filter id="glow2"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
   <clipPath id="cw"><rect x="190" y="360" width="700" height="1060" rx="18"/></clipPath>${shadow}</defs>
   <rect width="1080" height="1920" fill="url(#bg)"/>`;
  for(let i=0;i<120;i++)s+=`<circle cx="${rnd(i)*1080}" cy="${rnd(i+9)*1920}" r="${.6+rnd(i+3)*1.6}" fill="#fff" opacity="${.2+rnd(i+5)*.5}"/>`;
  s+=`<g transform="translate(540 900) rotate(-3) translate(-540 -900)" filter="url(#sh)">
   <rect x="150" y="300" width="780" height="1200" rx="34" fill="#f6e3c6"/>
   <rect x="168" y="318" width="744" height="1164" rx="26" fill="none" stroke="#c99a5c" stroke-width="3"/>
   <g clip-path="url(#cw)"><rect x="190" y="360" width="700" height="1060" fill="url(#cardsky)"/>`;
  for(let k=0;k<20;k++){const a=k/20*Math.PI*2+t*.15;s+=`<line x1="${540+Math.cos(a)*120}" y1="${700+Math.sin(a)*120}" x2="${540+Math.cos(a)*520}" y2="${700+Math.sin(a)*520}" stroke="#fff3c8" stroke-width="6" opacity=".25"/>`}
  s+=`<circle cx="540" cy="700" r="110" fill="#ffd36a" filter="url(#glow2)"/><circle cx="540" cy="700" r="80" fill="#fff0b8"/>
   <path d="M190,1180 Q360,1100 540,1160 T890,1140 L890,1420 L190,1420Z" fill="#7e3f63"/><path d="M190,1260 Q400,1210 600,1250 T890,1240 L890,1420 L190,1420Z" fill="#56294f"/>
   ${woman(540,880,1.45,{la:120,ra:120,look:12},t)}</g>
   <rect x="190" y="360" width="700" height="1060" rx="18" fill="none" stroke="#c99a5c" stroke-width="5"/>
   <text x="540" y="345" text-anchor="middle" font-family="Cinzel" font-weight="600" font-size="34" fill="#8c5a2c">I</text>
   <rect x="300" y="1380" width="480" height="80" rx="8" fill="#f6e3c6" stroke="#c99a5c" stroke-width="3"/>
   <text x="540" y="1434" text-anchor="middle" font-family="Cinzel" font-weight="600" font-size="44" fill="#6c3c5e">SUNDAY · THE SUN</text>`;
  [[176,326],[904,326],[176,1474],[904,1474]].forEach(([x,y])=>s+=`<path d="${'M0,-18 C3,-3 3,-3 18,0 C3,3 3,3 0,18 C-3,3 -3,3 -18,0 C-3,-3 -3,-3 0,-18Z'}" transform="translate(${x},${y})" fill="#c99a5c"/>`);
  s+=`</g><text x="540" y="1650" text-anchor="middle" font-family="Cormorant" font-weight="600" font-size="68" fill="#fff4e6">You were born to be seen.</text>
   <text x="540" y="210" text-anchor="middle" font-family="Jost" font-size="30" letter-spacing="10" fill="#ffc79a">YOUR BIRTH DAY CARD · 1 / 7</text>`;
  document.getElementById('B').innerHTML=s;
})();
// ---------- C: GOLD INK STAR CHART ----------
(function(){
  let s=`<defs><radialGradient id="cbg" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#3a1d3e"/><stop offset="1" stop-color="#1c0c1f"/></radialGradient>
   <filter id="gl"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>${paperTex('pt2',.25)}</defs>
   <g filter="url(#pt2)"><rect width="1080" height="1920" fill="url(#cbg)"/></g>`;
  // star chart grid
  for(let r=120;r<=520;r+=100)s+=`<circle cx="540" cy="700" r="${r}" fill="none" stroke="#f6d49a" stroke-width="1" opacity=".22"/>`;
  for(let k=0;k<24;k++){const a=k/24*Math.PI*2;s+=`<line x1="${540+Math.cos(a)*120}" y1="${700+Math.sin(a)*120}" x2="${540+Math.cos(a)*560}" y2="${700+Math.sin(a)*560}" stroke="#f6d49a" stroke-width="1" opacity=".14"/>`}
  for(let k=0;k<72;k++){const a=k/72*Math.PI*2;s+=`<line x1="${540+Math.cos(a)*520}" y1="${700+Math.sin(a)*520}" x2="${540+Math.cos(a)*(k%6?535:550)}" y2="${700+Math.sin(a)*(k%6?535:550)}" stroke="#f6d49a" stroke-width="1.5" opacity=".5"/>`}
  // constellation dots
  const pts=[[300,330],[380,280],[470,310],[560,250],[700,300],[780,380]];s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#f6d49a" stroke-width="1.5" opacity=".6"/>`;pts.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#fff3dc" filter="url(#gl)"/>`);
  // sun drawn in gold ink (partially drawn = live drawing)
  s+=`<g filter="url(#gl)" stroke="#f6d49a" fill="none" stroke-width="3"><circle cx="540" cy="700" r="110" stroke-dasharray="691" stroke-dashoffset="80"/><circle cx="540" cy="700" r="16" fill="#f6d49a"/>`;
  for(let k=0;k<16;k++){const a=k/16*Math.PI*2;s+=`<line x1="${540+Math.cos(a)*135}" y1="${700+Math.sin(a)*135}" x2="${540+Math.cos(a)*(k%2?175:205)}" y2="${700+Math.sin(a)*(k%2?175:205)}" stroke-linecap="round"/>`}
  s+=`</g><path d="M90,1430 Q300,1360 540,1420 T990,1400" stroke="#f6d49a" stroke-width="2" fill="none" opacity=".7" filter="url(#gl)"/>`;
  s+=`<g class="line" filter="url(#gl)">${woman(540,1000,1.6,{la:120,ra:120,look:10},t)}</g>`;
  s+=`<circle cx="700" cy="1160" r="5" fill="#fff3dc" filter="url(#gl)"/><path d="M700,1160 l40,-60" stroke="#fff3dc" stroke-width="2" filter="url(#gl)"/>`;
  s+=`<text x="540" y="260" text-anchor="middle" font-family="Cinzel" font-weight="600" font-size="92" fill="none" stroke="#f6d49a" stroke-width="2" filter="url(#gl)">SUNDAY</text>`;
  s+=`<text x="540" y="320" text-anchor="middle" font-family="Cormorant" font-style="italic" font-weight="500" font-size="42" fill="#ffc79a">the Sun's day</text>`;
  s+=`<text x="540" y="1650" text-anchor="middle" font-family="Cormorant" font-weight="600" font-size="70" fill="#fff4e6">You were born to be seen.</text>`;
  document.getElementById('C').innerHTML=s;
})();
</script></body></html>
