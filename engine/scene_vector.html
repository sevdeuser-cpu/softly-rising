<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Cinzel";font-weight:600;src:url("../node_modules/@fontsource/cinzel/files/cinzel-latin-600-normal.woff2")}
@font-face{font-family:"Cormorant";font-weight:600;src:url("../node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-600-normal.woff2")}
@font-face{font-family:"Cormorant";font-weight:500;font-style:italic;src:url("../node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-italic.woff2")}
@font-face{font-family:"Jost";font-weight:400;src:url("../node_modules/@fontsource/jost/files/jost-latin-400-normal.woff2")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#2a1633}
#stage{position:absolute;inset:0}
#hud{position:absolute;inset:0;pointer-events:none}
#label{position:absolute;left:0;right:0;top:230px;text-align:center}
#label .n{font:600 96px Cinzel;letter-spacing:.08em;filter:drop-shadow(0 0 16px rgba(246,212,154,.5)) drop-shadow(0 3px 3px rgba(42,22,51,.8))}
#label .n span{display:inline-block;background:linear-gradient(180deg,#fff6e2,#f6d49a 55%,#d49a5a);-webkit-background-clip:text;background-clip:text;color:transparent}
#label .c{font:400 26px Jost;letter-spacing:.4em;color:#ffc79a;margin-top:10px}
#cap{position:absolute;left:80px;right:80px;top:1440px;text-align:center;font:600 72px/1.15 Cormorant;color:#fff4e6;text-shadow:0 0 22px rgba(42,22,51,.95),0 3px 6px rgba(30,12,36,.9)}
#cap span{display:inline-block;margin:0 .12em}
#pbar{position:absolute;left:150px;right:150px;top:170px;display:flex;gap:10px}
#pbar i{flex:1;height:7px;border-radius:4px;background:rgba(255,243,220,.18);overflow:hidden;display:block}
#pbar i b{display:block;height:100%;background:linear-gradient(90deg,#f6d49a,#ffc79a);box-shadow:0 0 10px #f6d49a}
#hooktxt{position:absolute;left:0;right:0;top:300px;text-align:center;opacity:0}
#hooktxt .h1{font:600 118px Cinzel;letter-spacing:.05em;background:linear-gradient(180deg,#fff6e2,#f6d49a 55%,#d49a5a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(246,212,154,.6)) drop-shadow(0 4px 4px rgba(42,22,51,.9))}
#hooktxt .h2{font:500 italic 70px Cormorant;color:#ffc79a;margin:6px 0;text-shadow:0 3px 8px rgba(42,22,51,.9)}
#end{position:absolute;inset:0;opacity:0;background:radial-gradient(90% 60% at 50% 42%,rgba(140,63,94,.6),rgba(42,22,51,.97))}
#pp{position:absolute;left:290px;top:520px;width:500px;height:500px;border-radius:50%;overflow:hidden;box-shadow:0 0 80px rgba(243,200,115,.45),0 0 0 3px rgba(243,200,115,.6)}
#pp img{width:100%;height:100%;object-fit:cover}
.etxt{position:absolute;left:0;right:0;text-align:center}
</style></head><body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<div id="hud"><div id="pbar"></div><div id="hooktxt"></div><div id="label"><div class="n"></div><div class="c"></div></div><div id="cap"></div></div>
<div id="end"><div id="pp"><img src="../assets/pp.png"></div>
 <div class="etxt" id="e1" style="top:1090px;font:600 88px Cinzel;letter-spacing:.04em;color:#f6d690">The Softly Rising</div>
 <div class="etxt" id="e2" style="top:1210px;font:400 30px Jost;letter-spacing:.45em;color:#e9b9c6">HEAL · GLOW · RISE</div>
 <div class="etxt" id="e3" style="top:1290px;font:500 italic 52px Cormorant;color:#fff4e6">follow for your daily sky</div></div>
<script>
// ---------- palette (channel colours: plum night, rose horizon, gold) ----------
const C={ // SOFTLY RISING signature palette: "the rising hour" — aubergine sky melting into coral dawn
  sky0:"#2a1633",sky1:"#4a2445",sky2:"#8c3f5e",hz:"#e9786a",hz2:"#ffc79a",m1:"#8e5272",m2:"#6c3c5e",m3:"#52304d",gnd:"#3b2139",
  gold:"#f6d49a",gold2:"#fff3dc",rose:"#ff8f7a",skin:"#f6d2bd",skin2:"#e6b8a0",
  hair:"#e9c27f",hairS:"#c99a5c",bow:"#f49f86",dress:"#f6e3c6",dress2:"#e4c59e",
  hair2:"#3a2230",shirt:"#5e3560",pants:"#3a2140",cream:"#fff6ea"};
const GLYPH={sun:"☉",moon:"☽",mars:"♂",mercury:"☿",jupiter:"♃",venus:"♀",saturn:"♄"};
const ORDER=["sun","moon","mars","mercury","jupiter","venus","saturn"];
const ABBR=["SUN","MON","TUE","WED","THU","FRI","SAT"];
const PL={sun:["#fff6c8","#ffc94a","#ff8a2a"],moon:["#fffdf4","#efe6d4","#c4b8a3"],mars:["#ffc2a0","#d8603a","#8a3018"],
  mercury:["#f2f2fa","#aab2c8","#5a6280"],jupiter:["#fbe7c2","#e0a86e","#9a6238"],venus:["#fff3ee","#f5c3ba","#c98a95"],saturn:["#fff1d2","#e4c690","#9a7444"]};
let TL,SND,groups=[];
const cl=(x)=>Math.min(1,Math.max(0,x)), eo=x=>1-Math.pow(1-cl(x),3), eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const lerp=(a,b,t)=>a+(b-a)*t;
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}

// ---------- background ----------
function sky(t){
  let s=`<defs>
   <linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.sky0}"/><stop offset=".45" stop-color="${C.sky1}"/><stop offset=".62" stop-color="${C.sky2}"/><stop offset=".7" stop-color="${C.hz}"/><stop offset=".73" stop-color="${C.hz2}"/></linearGradient>
   <radialGradient id="hglow" cx=".5" cy=".7" r=".5"><stop offset="0" stop-color="${C.hz2}" stop-opacity=".45"/><stop offset="1" stop-color="${C.hz2}" stop-opacity="0"/></radialGradient>
   <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter><filter id="blur20" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="20"/></filter>
   <filter id="ppr" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#1a0818" flood-opacity=".5" result="d"/>
     <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="7" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="g"/>
     <feComposite in="g" in2="SourceGraphic" operator="in" result="gt"/><feBlend in="gt" in2="SourceGraphic" mode="soft-light" result="tex"/>
     <feMerge><feMergeNode in="d"/><feMergeNode in="tex"/></feMerge></filter>
   <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs><rect width="1080" height="1920" fill="url(#sk)"/><rect width="1080" height="1920" fill="url(#hglow)"/>`;
  for(let i=0;i<170;i++){const x=rnd(i)*1080,y=rnd(i+500)*1250,r=.6+rnd(i+900)*1.8,a=(.3+.7*Math.abs(Math.sin(t*(.5+rnd(i+77))+i)))*Math.max(0,1-y/1050);
    s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${rnd(i+33)<.15?C.gold2:'#fff'}" opacity="${a.toFixed(2)}"/>`}
  return s;
}
function mountains(t){
  const dx=Math.sin(t*.05)*12;
  const ridge=(y,amp,seed,col,ofs)=>{let d=`M${-40+ofs},2400 L${-40+ofs},${y}`;for(let x=-40;x<=1120;x+=60){d+=` L${x+ofs},${y-amp*(.5+.5*Math.sin(x*.011+seed)+.35*Math.sin(x*.027+seed*2))+Math.sin(x*.23+seed)*3}`}return `<path d="${d} L${1120+ofs},2400Z" fill="${col}" filter="url(#ppr)"/>`};
  return ridge(1300,120,1,C.m1,dx*.4)+ridge(1360,90,3,C.m2,dx*.7)+`<path d="M0,1430 Q540,1395 1080,1430 L1080,2400 L0,2400Z" fill="${C.m3}" filter="url(#ppr)"/>`+
    `<path d="M0,1470 Q540,1450 1080,1470 L1080,2400 L0,2400Z" fill="${C.gnd}" filter="url(#ppr)"/>`;
}
// ---------- planets ----------
let POP=1;
function planet(id,x,y,r,op=1,t=0){
  y-=LIFT; const [a,b,c]=PL[id];let s=`<g opacity="${op}" transform="translate(${x} ${y}) scale(${POP}) translate(${-x} ${-y})"><defs><radialGradient id="pg${id}${Math.round(x)}" cx=".36" cy=".32" r=".75"><stop offset="0" stop-color="${a}"/><stop offset=".55" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></radialGradient></defs>`;
  s+=`<circle cx="${x}" cy="${y}" r="${r*2.1}" fill="${b}" opacity=".18" filter="url(#blur20)"/>`;
  if(id==='sun') for(let k=0;k<16;k++){const an=k/16*Math.PI*2+t*.2;s+=`<line x1="${x+Math.cos(an)*r*1.2}" y1="${y+Math.sin(an)*r*1.2}" x2="${x+Math.cos(an)*r*1.55}" y2="${y+Math.sin(an)*r*1.55}" stroke="${b}" stroke-width="${r*.08}" stroke-linecap="round" opacity=".7"/>`}
  if(id==='saturn') s+=`<ellipse cx="${x}" cy="${y}" rx="${r*1.9}" ry="${r*.45}" fill="none" stroke="${b}" stroke-width="${r*.14}" opacity=".85" transform="rotate(-16 ${x} ${y})" clip-path="inset(0 0 50% 0)"/>`;
  s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="url(#pg${id}${Math.round(x)})" filter="url(#ppr)"/>`;
  if(id==='jupiter') for(let k=-2;k<=2;k++) s+=`<ellipse cx="${x}" cy="${y+k*r*.32}" rx="${r*Math.sqrt(1-Math.pow(k*.32,2))*.98}" ry="${r*.05}" fill="${c}" opacity=".45"/>`;
  if(id==='moon') s+=`<circle cx="${x-r*.3}" cy="${y-r*.2}" r="${r*.18}" fill="${c}" opacity=".45"/><circle cx="${x+r*.28}" cy="${y+r*.25}" r="${r*.24}" fill="${c}" opacity=".4"/>`;
  if(id==='mars') s+=`<circle cx="${x+r*.2}" cy="${y-r*.25}" r="${r*.2}" fill="${c}" opacity=".4"/>`;
  if(id==='saturn') s+=`<path d="M${x-r*1.9},${y} A${r*1.9},${r*.45} 0 0 0 ${x+r*1.9},${y}" fill="none" stroke="${b}" stroke-width="${r*.14}" transform="rotate(-16 ${x} ${y})" opacity=".9"/>`;
  s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>`;
  return s+`</g>`;
}
// ---------- characters (flat vector, faceless like the reference style) ----------
// pose: {la, ra} arm angles in degrees (0 = down, 90 = forward/out, 170 = up), lean, look (head tilt up)
function woman(x,y,sc,pose,t,o={}){
  const br=Math.sin(t*2.1)*1.2, sway=Math.sin(t*1.3)*3, op=o.op??1, flip=o.flip?-1:1;
  const arm=(sx,ang,side)=>`<g transform="translate(${sx},62) rotate(${ang*side})"><path d="M-3.8,0 L3.8,0 L3,52 L-3,52Z" fill="${C.skin}"/><path d="M-6,-3 L6,-3 L5.5,13 L-5.5,13Z" fill="${C.dress2}"/><circle cx="0" cy="53" r="4" fill="${C.skin}"/></g>`;
  const wave=(o)=>Math.sin(t*1.6+o)*2.5;
  return `<g filter="url(#ppr)"><g transform="translate(${x},${y}) scale(${sc*flip},${sc}) rotate(${pose.lean||0} 0 250)" opacity="${op}">
   <ellipse cx="0" cy="254" rx="38" ry="6" fill="#1a0a18" opacity=".3"/>
   <path d="M-18,22 C-30,52 ${-26+wave(1)},96 ${-20+wave(2)},122 C-10,128 10,128 ${20+wave(3)},122 C${26+wave(1)},96 30,52 18,22Z" fill="${C.hairS}"/>
   <path d="M-14,26 C-22,56 ${-18+wave(2)},98 ${-12+wave(3)},118 L${12+wave(1)},118 C${18+wave(2)},98 22,56 14,26Z" fill="${C.hair}"/>
   ${arm(-13,pose.ra??8,-1)}
   <rect x="-5" y="186" width="4.5" height="62" rx="2" fill="${C.skin2}"/><rect x="1.5" y="186" width="4.5" height="62" rx="2" fill="${C.skin}"/>
   <path d="M-12,54 L12,54 L15,92 L${44+sway},${206+br} C${10+sway},${214+br} ${-20+sway*.6},${214+br} ${-44+sway*.6},${206+br} L-15,92Z" fill="${C.dress}"/>
   <path d="M2,92 L15,92 L${44+sway},${206+br} C${30+sway},${210+br} ${22+sway},${211+br} ${14+sway},${212+br}Z" fill="${C.dress2}" opacity=".7"/>
   <path d="M-15,90 Q0,96 15,90" stroke="${C.dress2}" stroke-width="3" fill="none"/>
   <rect x="-4.5" y="40" width="9" height="16" fill="${C.skin2}"/>
   <g transform="rotate(${-(pose.look||0)} 0 44)"><circle cx="0" cy="28" r="16.5" fill="${C.skin}"/>
     <path d="M-18,32 C-21,6 -6,2 0,2 C11,2 21,8 18,32 C14,16 4,12 -6,14 C-12,16 -15,24 -18,32Z" fill="${C.hair}"/>
     <path d="M-24,14 L-12,20 L-24,27Z M-4,20 L-12,20" fill="${C.bow}"/><circle cx="-12" cy="20" r="3.4" fill="${C.bow}"/>
     <path d="M-12,22 L-16,36 M-12,22 L-8,37" stroke="${C.bow}" stroke-width="2.6" stroke-linecap="round"/></g>
   ${arm(13,pose.la??8,1)}
  </g></g>`;
}
function man(x,y,sc,pose,t,o={}){
  const op=o.op??1, flip=o.flip?-1:1;
  const arm=(sx,ang,side)=>`<g transform="translate(${sx},60) rotate(${ang*side})"><path d="M-5,0 L5,0 L4,54 L-4,54Z" fill="${C.shirt}"/><circle cx="0" cy="56" r="4.5" fill="${C.skin}"/></g>`;
  return `<g filter="url(#ppr)"><g transform="translate(${x},${y}) scale(${sc*flip},${sc}) rotate(${pose.lean||0} 0 250)" opacity="${op}">
   <ellipse cx="0" cy="254" rx="34" ry="6" fill="#000" opacity=".25"/>
   ${arm(-15,pose.ra??6,-1)}
   <rect x="-12" y="132" width="10" height="118" rx="4" fill="${C.pants}"/><rect x="2" y="132" width="10" height="118" rx="4" fill="#2f335a"/>
   <path d="M-16,56 L16,56 L14,138 L-14,138Z" fill="${C.shirt}"/>
   <rect x="-5" y="42" width="10" height="16" fill="${C.skin2}"/>
   <g transform="rotate(${-(pose.look||0)} 0 46)"><circle cx="0" cy="28" r="17" fill="${C.skin}"/>
   <path d="M-17,26 C-18,8 -4,6 2,6 C12,6 19,12 17,24 C10,16 -4,14 -17,26Z" fill="${C.hair2}"/></g>
   ${arm(15,pose.la??6,1)}
  </g></g>`;
}
// ---------- props ----------
const heart=(x,y,s,col,op=1)=>`<path transform="translate(${x},${y}) scale(${s})" d="M0,8 C-12,-6 -26,4 -14,16 L0,28 L14,16 C26,4 12,-6 0,8Z" fill="${col}" opacity="${op}"/>`;
const star=(x,y,r,col,op=1)=>`<path transform="translate(${x},${y})" d="M0,${-r} C${r*.15},${-r*.15} ${r*.15},${-r*.15} ${r},0 C${r*.15},${r*.15} ${r*.15},${r*.15} 0,${r} C${-r*.15},${r*.15} ${-r*.15},${r*.15} ${-r},0 C${-r*.15},${-r*.15} ${-r*.15},${-r*.15} 0,${-r}Z" fill="${col}" opacity="${op}" filter="url(#glow)"/>`;

const GX=540, GY=1225, SC=1.65; const LIFT=-235;           // main character anchor
// ---------- captions ----------
function buildGroups(){groups=[];TL.segments.forEach(s=>{let cur=[];s.words.forEach((w,i)=>{cur.push(w);
  if(cur.length>=4||/[.,?!]$/.test(w.w)||i===s.words.length-1){groups.push({words:cur,t0:cur[0].t,seg:s});cur=[]}})});
  groups.forEach((g,i)=>{g.t1=i+1<groups.length&&groups[i+1].seg===g.seg?groups[i+1].t0:g.seg.end+.3})}
window.init=async()=>{const q=new URLSearchParams(location.search);const v='../'+q.get('v')+'/';
  TL=await (await fetch(v+'timeline.json')).json();SND=await (await fetch(v+'sound_info.json')).json();
  await new Promise(r=>{const sc=document.createElement('script');sc.src=q.get('scenes')||'scenes_weekday.js';sc.onload=r;document.body.appendChild(sc)});
  if(TL.keys) KEY=new RegExp('^('+TL.keys.join('|')+')$','i'); buildGroups()};
const eb=x=>{x=cl(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};   // ease-out-back (pop)
let KEY=/^(sun|sun's|moon|mars|mercury|jupiter|venus|saturn|saturn's|planet|seen|everything|brave|braver|war|doors|luck|softness|unbreakable|born|tiw's|woden's|thor's|frigg's)$/i;
const TRANS=['whip','zoom','iris','whipR','zoom','iris','whip','zoom','iris'];
function cuts(){return TL.segments.map((s,i)=>i===0?0:s.start-.12)}
function sceneSVG(k,t,blurX){ // one full scene layer (mountains + body), camera applied
  const sg=TL.segments[k], C=cuts(), nx=TL.segments[k+1];
  const u=t-C[k]+.25, D=(nx?C[k+1]:TL.duration)-C[k];
  POP = (sg.day||sg.title) ? eb((u-.15)/.55) : 1;
  const body=SCENES[sg.id](u,D,t);
  // camera: slow push-in + punch on key words
  let cam=1+.07*eio(u/Math.max(D,1));
  for(const g of groups) if(g.seg===sg) for(const w of g.words){const d=t-w.t; if(KEY.test(w.w.replace(/[^\w']/g,''))&&d>0&&d<.4) cam+=.035*Math.sin(d/.4*Math.PI)}
  const cy=820+LIFT*0;
  const f=blurX?`filter="url(#mb)"`:'';
  return `<g ${f}><g transform="translate(540 ${cy}) scale(${cam}) translate(-540 ${-cy}) translate(0,${LIFT})">`+mountains(t)+body+`</g></g>`;
}
window.setFrame=(t)=>{
  const segs=TL.segments, C=cuts();
  let k=0; for(let i=0;i<segs.length;i++) if(t>=C[i]) k=i;
  const s=segs[k], u=t-C[k]+.25;
  // which transition is active? window [cut-.3, cut+.3] around the next / current cut
  let html=sky(t)+`<defs><filter id="mb" x="-20%" y="0" width="140%" height="100%"><feGaussianBlur stdDeviation="38 0"/></filter></defs>`;
  const nextCut=C[k+1], dtN=nextCut!=null? t-nextCut : 99, dtC=t-C[k];
  let a=null,b=null,p=0,type=null;
  if(k>0 && dtC<.3){a=k-1;b=k;p=(dtC+.3)/.6;type=TRANS[(k-1)%TRANS.length]}
  else if(nextCut!=null && dtN>-.3){a=k;b=k+1;p=(dtN+.3)/.6;type=TRANS[k%TRANS.length]}
  if(type){
    const q=eio(p);
    if(type==='whip'||type==='whipR'){const dir=type==='whip'?-1:1, blur=Math.sin(p*Math.PI)>.35;
      html+=`<g transform="translate(${dir*1080*q},0)">${sceneSVG(a,t,blur)}</g><g transform="translate(${-dir*1080*(1-q)},0)">${sceneSVG(b,t,blur)}</g>`;}
    else if(type==='zoom'){
      const sa=1+q*3.2, sb=.55+.45*eo((p-.45)/.55);
      html+=`<g opacity="${1-cl((p-.4)/.25)}" transform="translate(540 700) scale(${sa}) translate(-540 -700)">${sceneSVG(a,t)}</g>`;
      html+=`<g opacity="${cl((p-.42)/.2)}" transform="translate(540 820) scale(${sb}) translate(-540 -820)">${sceneSVG(b,t)}</g>`;
      html+=`<rect width="1080" height="1920" fill="#fff3dc" opacity="${.85*Math.max(0,1-Math.abs(p-.47)/.12)}"/>`;}
    else { // iris: new scene opens from a circle at the planet position
      const r=1500*eio(p);
      html+=sceneSVG(a,t)+`<defs><clipPath id="ir"><circle cx="540" cy="560" r="${r}"/></clipPath></defs><g clip-path="url(#ir)">${sceneSVG(b,t)}</g>`+
        `<circle cx="540" cy="560" r="${r}" fill="none" stroke="#f6d49a" stroke-width="${8*(1-p)+1}" opacity="${1-p}" filter="url(#glow)"/>`;}
  } else html+=sceneSVG(k,t);
  document.getElementById('stage').innerHTML=html;
  // hook title (first segment): pop + shake, captions hidden underneath
  const H=document.getElementById('hooktxt'), hk=segs[0];
  if(!H.dataset.ok){const hl=TL.hook||['YOUR BIRTH DAY','is secretly a','PLANET'];H.innerHTML=hl.map((x,j)=>`<div class="${j%2?'h2':'h1'}">${x}</div>`).join('');H.dataset.ok=1}
  if(k===0){const pp=eb(t/.45), sh=t<.35?(Math.sin(t*90)*8*(1-t/.35)):0, out=1-eo((t-(C[1]-.35))/.3);
    H.style.opacity=Math.min(cl(t/.15),out); H.style.transform=`translate(${sh}px,${-sh*.6}px) scale(${.7+.3*pp})`;
    [...H.children].forEach((el,j)=>{const q=eb((t-j*.32)/.45);el.style.opacity=cl((t-j*.32)/.15);el.style.transform=`scale(${.5+.5*q})`})}
  else H.style.opacity=0;
  // progress bar over the 7 days
  const days=segs.filter(x=>x.day||x.title), di=days.indexOf(s);
  document.getElementById('pbar').innerHTML=days.map((d,j)=>{let f=0;
    if(s.id==='cta'||k>segs.indexOf(days[days.length-1]))f=1; else if(di>=0){f=j<di?1:j===di?cl((t-C[k])/((C[k+1]??TL.duration)-C[k])):0}
    return `<i><b style="width:${f*100}%"></b></i>`}).join('');
  document.getElementById('pbar').style.opacity=(k===0?0:1)*(t<SND.sig_start?1:0);
  // label (day title) with pop
  const L=document.querySelector('#label .n'),Lc=document.querySelector('#label .c');
  const ttlText=s.day||s.title;

};
