<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Cinzel";font-weight:600;src:url("../node_modules/@fontsource/cinzel/files/cinzel-latin-600-normal.woff2")}
@font-face{font-family:"Cinzel";font-weight:500;src:url("../node_modules/@fontsource/cinzel/files/cinzel-latin-500-normal.woff2")}
@font-face{font-family:"Cormorant";font-weight:600;src:url("../node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-600-normal.woff2")}
@font-face{font-family:"Cormorant";font-weight:500;font-style:italic;src:url("../node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-italic.woff2")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#120c1c}
.layer{position:absolute;inset:0}
.bg{position:absolute;left:0;top:0;background-image:url("../assets/banner_art_x2.5.jpg");background-repeat:no-repeat;transform-origin:0 0;will-change:transform}
#shade{background:
  linear-gradient(180deg,rgba(18,10,30,.55) 0%,rgba(18,10,30,0) 22%,rgba(18,10,30,0) 48%,rgba(18,10,30,.62) 66%,rgba(14,8,24,.82) 100%),
  radial-gradient(120% 70% at 50% 40%,rgba(0,0,0,0) 55%,rgba(10,5,20,.55) 100%)}
#leak{background:radial-gradient(60% 40% at 50% 35%,rgba(255,214,160,.9),rgba(255,160,150,.35) 45%,rgba(0,0,0,0) 75%);mix-blend-mode:screen;opacity:0}
canvas{position:absolute;inset:0}
#medal{position:absolute;left:280px;top:300px;width:520px;height:520px}
.orb{position:absolute;left:150px;top:150px;width:220px;height:220px;border-radius:50%;opacity:0}
#dayttl{position:absolute;left:0;right:0;top:860px;text-align:center;font:600 118px Cinzel;letter-spacing:.06em;white-space:nowrap}
#dayttl span{display:inline-block}
.gold{background:linear-gradient(180deg,#fff4d0 0%,#f3c873 45%,#c8913a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
      filter:drop-shadow(0 0 18px rgba(243,200,115,.55)) drop-shadow(0 2px 2px rgba(40,20,0,.6))}
#daysub{position:absolute;left:0;right:0;top:1000px;text-align:center;font:500 italic 54px Cormorant;color:#ffd9cf;text-shadow:0 2px 10px rgba(20,8,30,.9)}
#prog{position:absolute;left:0;right:0;top:215px;display:flex;justify-content:center;gap:34px;font:44px "DejaVu Sans";}
#prog span{color:#f3c873;opacity:.28;text-shadow:0 0 10px rgba(243,200,115,.0)}
#cap{position:absolute;left:70px;right:70px;top:1180px;text-align:center;font:600 76px/1.12 Cormorant;color:#fff4e6;
     text-shadow:0 0 22px rgba(20,8,30,.95),0 3px 6px rgba(20,8,30,.9)}
#cap span{display:inline-block;margin:0 .13em;transition:none}
#end{opacity:0;background:radial-gradient(90% 60% at 50% 42%,rgba(40,18,52,.55),rgba(12,6,20,.95))}
#pp{position:absolute;left:290px;top:520px;width:500px;height:500px;border-radius:50%;overflow:hidden;
    box-shadow:0 0 80px rgba(243,200,115,.45),0 0 0 3px rgba(243,200,115,.6)}
#pp img{width:100%;height:100%;object-fit:cover}
#endname{position:absolute;left:0;right:0;top:1090px;text-align:center;font:600 92px Cinzel;letter-spacing:.04em}
#endtag{position:absolute;left:0;right:0;top:1215px;text-align:center;font:500 34px Cinzel;color:#ffd9cf;letter-spacing:.42em}
#endcta{position:absolute;left:0;right:0;top:1300px;text-align:center;font:500 italic 50px Cormorant;color:#fff4e6}
#grain{opacity:.07;mix-blend-mode:overlay}
</style></head><body>
<div id="bgA" class="bg"></div><div id="bgB" class="bg"></div>
<div id="shade" class="layer"></div>
<canvas id="dust" width="1080" height="1920"></canvas>
<div id="leak" class="layer"></div>
<div id="prog"></div>
<svg id="medal" viewBox="-260 -260 520 520"></svg>
<div id="orbs"></div>
<div id="ttlbg" style="position:absolute;left:40px;right:40px;top:800px;height:300px;background:radial-gradient(50% 50% at 50% 50%,rgba(16,6,26,.6),rgba(16,6,26,0));opacity:0"></div><div id="dayttl"></div><div id="daysub"></div>
<div id="cap"></div>
<div id="end" class="layer"><div id="pp"><img src="../assets/pp.png"></div>
  <div id="endname" class="gold">The Softly Rising</div><div id="endtag">HEAL · GLOW · RISE</div>
  <div id="endcta">follow for your daily sky</div></div>
<svg id="grain" class="layer" width="1080" height="1920"><filter id="gf"><feTurbulence id="turb" type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="1"/></filter><rect width="100%" height="100%" filter="url(#gf)"/></svg>
<script>
const SRC_SCALE = 2.5;                       // banner was upscaled 2.5x
// crop windows in ORIGINAL banner coords (1672x941): [x, y, h] start -> end; grade = CSS filter
const SHOTS = {
  hook:    {a:[1143,0,941],  b:[1250,40,800],  f:"saturate(1.05)"},
  intro:   {a:[640,0,600],   b:[780,10,560],   f:"saturate(1.1) brightness(1.02)"},
  sun:     {a:[735,300,641], b:[805,380,520],  f:"saturate(1.2) brightness(1.06)"},
  moon:    {a:[1300,0,520],  b:[1335,40,420],  f:"saturate(.85) hue-rotate(-12deg) brightness(.95)"},
  mars:    {a:[0,150,700],   b:[60,230,560],   f:"sepia(.25) saturate(1.35) hue-rotate(-14deg)"},
  mercury: {a:[150,60,580],  b:[195,110,480],  f:"brightness(1.04) saturate(1.05)"},
  jupiter: {a:[30,270,540],  b:[85,330,440],   f:"saturate(1.25) brightness(1.08) sepia(.12)"},
  venus:   {a:[0,381,560],   b:[25,430,470],   f:"saturate(1.12) hue-rotate(-8deg)"},
  saturn:  {a:[520,380,561], b:[565,425,490],  f:"saturate(.72) brightness(.9) contrast(1.06) hue-rotate(-6deg)"},
  cta:     {a:[1240,60,800], b:[1143,0,941],   f:"saturate(1.05)"},
};
const GLYPH = {sun:"☉",moon:"☽",mars:"♂",mercury:"☿",jupiter:"♃",venus:"♀",saturn:"♄"};
const ORDER = ["sun","moon","mars","mercury","jupiter","venus","saturn"];
const ORB = {
  sun:"radial-gradient(circle at 40% 35%,#fffbe6,#ffd35a 35%,#ff9a2a 70%,#c4500f)",
  moon:"radial-gradient(circle at 38% 32%,#fffdf6,#f1eadb 55%,#c9bfae)",
  mars:"radial-gradient(circle at 38% 32%,#ffc8a8,#d9653a 45%,#7a2a16)",
  mercury:"radial-gradient(circle at 38% 32%,#f4f3fa,#a9b0c6 50%,#4f566f)",
  jupiter:"radial-gradient(circle at 38% 32%,rgba(255,255,255,.55),rgba(0,0,0,0) 45%,rgba(60,30,10,.55) 100%),repeating-linear-gradient(180deg,#f3d9a8 0 16px,#d9a066 16px 26px,#f0caa0 26px 40px,#b97a4a 40px 46px)",
  venus:"radial-gradient(circle at 38% 32%,#fff6f1,#f6c8bd 50%,#c27f8c)",
  saturn:"radial-gradient(circle at 38% 32%,#fff3d6,#e3c48c 50%,#8f6a3c)",
};
const GLOW = {sun:"#ffb347",moon:"#fff1d6",mars:"#ff7a50",mercury:"#c9d2ff",jupiter:"#ffcf8a",venus:"#ffb7c5",saturn:"#ead39a"};
let TL=null, SND=null, groups=[];
const ease=x=>{x=Math.min(1,Math.max(0,x));return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eo=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
const lerp=(a,b,t)=>a+(b-a)*t;

function setBg(el, shot, p){
  const S=SHOTS[shot]; const q=ease(p);
  const x=lerp(S.a[0],S.b[0],q), y=lerp(S.a[1],S.b[1],q), h=lerp(S.a[2],S.b[2],q);
  const sc=1920/(h*SRC_SCALE);
  const w=1080/sc/SRC_SCALE; const xc=Math.min(Math.max(x,0),1672-w);
  el.style.width=(1672*SRC_SCALE)+"px"; el.style.height=(941*SRC_SCALE)+"px";
  el.style.transform=`scale(${sc}) translate(${-xc*SRC_SCALE}px,${-y*SRC_SCALE}px)`;
  el.style.filter=S.f;
}
function medalSVG(t, active, intro){
  const rot=t*5; let s=`<defs><radialGradient id="mg"><stop offset=".6" stop-color="#f3c873" stop-opacity="0"/><stop offset="1" stop-color="#f3c873" stop-opacity=".18"/></radialGradient></defs>`;
  s+=`<circle r="236" fill="url(#mg)"/>`;
  s+=`<g transform="rotate(${rot})"><circle r="236" fill="none" stroke="#f3c873" stroke-width="2.2" opacity=".9"/><circle r="224" fill="none" stroke="#f3c873" stroke-width="1" opacity=".55"/>`;
  for(let i=0;i<56;i++){const a=i/56*Math.PI*2, r1=i%2?226:221;s+=`<line x1="${Math.cos(a)*r1}" y1="${Math.sin(a)*r1}" x2="${Math.cos(a)*234}" y2="${Math.sin(a)*234}" stroke="#f3c873" stroke-width="${i%2?1:1.6}" opacity=".7"/>`}
  s+=`</g><g transform="rotate(${-rot*0.6})"><circle r="176" fill="none" stroke="#f3c873" stroke-width="1" stroke-dasharray="2 9" opacity=".7"/>`;
  ORDER.forEach((k,i)=>{const a=-Math.PI/2+i/7*Math.PI*2, r=200;
    const on = intro!=null ? (intro>i/7) : (k===active);
    s+=`<text x="${Math.cos(a)*r}" y="${Math.sin(a)*r}" transform="rotate(${rot*0.6} ${Math.cos(a)*r} ${Math.sin(a)*r})" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans" font-size="30" fill="${on?'#fff4d0':'#f3c873'}" opacity="${on?1:.45}" style="${on?'filter:drop-shadow(0 0 8px #f3c873)':''}">${GLYPH[k]}</text>`});
  s+=`</g>`; return s;
}

function orbHTML(id,p,t){
  const S=240, L=420, T=450; const sc=0.6+0.4*p, ty=(1-p)*40;
  let h=`<div style="position:absolute;left:${L}px;top:${T}px;width:${S}px;height:${S}px;opacity:${p};transform:translateY(${ty}px) scale(${sc})">`;
  if(id==='sun') h+=`<div style="position:absolute;inset:-90px;border-radius:50%;background:repeating-conic-gradient(from ${t*12}deg,rgba(255,200,110,.35) 0 4deg,rgba(255,200,110,0) 4deg 15deg);filter:blur(5px);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%)"></div>`;
  h+=`<div style="position:absolute;inset:-60px;border-radius:50%;background:radial-gradient(circle,${GLOW[id]}66 0%,${GLOW[id]}22 45%,transparent 70%)"></div>`;
  if(id==='saturn') h+=ringHalf(S,'back');
  h+=`<div style="position:absolute;inset:0;border-radius:50%;overflow:hidden;background:${ORB[id]};
      box-shadow:inset -18px -22px 40px rgba(20,6,30,${id==='sun'?0:.55}),inset 10px 12px 26px rgba(255,255,255,.35),inset -6px -4px 14px rgba(255,170,140,.35)">
      <svg width="${S}" height="${S}" style="position:absolute;inset:0;mix-blend-mode:overlay;opacity:${id==='sun'?.25:.5}"><filter id="tx${id}"><feTurbulence type="fractalNoise" baseFrequency="${id==='jupiter'?'.004 .06':'.035'}" numOctaves="4" seed="${id.length*7}"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#tx${id})"/></svg>
      ${id==='moon'?`<div style="position:absolute;left:60px;top:70px;width:46px;height:46px;border-radius:50%;background:rgba(150,135,115,.35);box-shadow:inset 3px 4px 6px rgba(80,60,40,.35)"></div><div style="position:absolute;left:140px;top:120px;width:64px;height:64px;border-radius:50%;background:rgba(150,135,115,.3);box-shadow:inset 3px 4px 8px rgba(80,60,40,.3)"></div><div style="position:absolute;left:95px;top:165px;width:28px;height:28px;border-radius:50%;background:rgba(150,135,115,.35)"></div>`:''}
      ${id==='sun'?'':`<div style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(0,0,0,0) 45%,rgba(18,6,32,.6) 100%)"></div>`}
    </div>`;
  if(id==='saturn') h+=ringHalf(S,'front');
  return h+`</div>`;
}
function ringHalf(S,which){
  const w=S*2.1, hh=S*0.46, l=(S-w)/2, tp=(S-hh)/2;
  const clip= which==='back' ? 'inset(0 0 50% 0)' : 'inset(50% 0 0 0)';
  return `<div style="position:absolute;left:${l}px;top:${tp}px;width:${w}px;height:${hh}px;transform:rotate(-16deg);clip-path:${clip}">
     <div style="position:absolute;inset:0;border-radius:50%;border:14px solid rgba(232,206,150,.75);box-shadow:0 0 18px rgba(232,206,150,.45),inset 0 0 10px rgba(255,240,200,.5)"></div>
     <div style="position:absolute;inset:16px 22px;border-radius:50%;border:4px solid rgba(200,170,120,.55)"></div></div>`;
}

function drawDust(t){
  const c=document.getElementById('dust').getContext('2d'); c.clearRect(0,0,1080,1920);
  for(let i=0;i<110;i++){
    const r1=Math.sin(i*12.9898)*43758.5453%1, r2=Math.sin(i*78.233)*12345.678%1, r3=Math.sin(i*39.425)*24680.13%1;
    const sp=18+Math.abs(r2)*40, x=(Math.abs(r1)*1080+Math.sin(t*0.6+i)*14)%1080;
    const y=1920-((Math.abs(r3)*1920+t*sp)%2100);
    const sz=0.8+Math.abs(r2)*2.6, a=(0.25+0.6*Math.abs(Math.sin(t*1.3+i)))*(y<1700?1:0.4);
    const g=c.createRadialGradient(x,y,0,x,y,sz*4); g.addColorStop(0,`rgba(255,230,170,${a})`); g.addColorStop(1,'rgba(255,200,140,0)');
    c.fillStyle=g; c.beginPath(); c.arc(x,y,sz*4,0,7); c.fill();
  }
}
function buildGroups(){
  groups=[];
  TL.segments.forEach(s=>{
    let cur=[];
    s.words.forEach((w,i)=>{cur.push(w); const end=/[.,?!]$/.test(w.w);
      if(cur.length>=4 || end || i===s.words.length-1){groups.push({words:cur, t0:cur[0].t, seg:s}); cur=[]}});
  });
  groups.forEach((g,i)=>{g.t1 = i+1<groups.length && groups[i+1].seg===g.seg ? groups[i+1].t0 : g.seg.end+0.3});
}
function segAt(t){let s=TL.segments[0];for(const x of TL.segments){if(t>=x.start-0.45)s=x}return s}
window.init=async()=>{
  TL=await (await fetch('../videos/001_weekday_planets/timeline.json')).json();
  SND=await (await fetch('../videos/001_weekday_planets/sound_info.json')).json();
  buildGroups();
  document.getElementById('prog').innerHTML=ORDER.map(k=>`<span data-k="${k}">${GLYPH[k]}</span>`).join('');
};
window.setFrame=(t)=>{
  const segs=TL.segments; const s=segAt(t); const i=segs.indexOf(s);
  // background crossfade between previous and current shot
  const prev=segs[Math.max(0,i-1)]; const xf=i===0?1:eo((t-(s.start-0.45))/0.7);
  const span=(x)=>{const n=segs[segs.indexOf(x)+1];return [x.start-0.45,(n?n.start:TL.duration)+0.3]};
  const [a0,a1]=span(s),[b0,b1]=span(prev);
  setBg(document.getElementById('bgB'),s.id,(t-a0)/(a1-a0)); setBg(document.getElementById('bgA'),prev.id,(t-b0)/(b1-b0));
  document.getElementById('bgB').style.opacity=xf;
  // light leak at transitions
  const dt=Math.min(...segs.slice(1).map(x=>Math.abs(t-(x.start-0.1))));
  document.getElementById('leak').style.opacity=Math.max(0,1-dt/0.45)*0.55;
  drawDust(t);
  // medallion + orb
  const isDay=!!s.day, med=document.getElementById('medal');
  const introP = s.id==='intro' ? (t-s.start)/(s.end-s.start)*1.15 : (s.id==='hook'? 0 : null);
  const medIn = s.id==='cta' ? 1-eo((t-s.start)/0.6) : eo((t-0.2)/0.9);
  med.innerHTML=medalSVG(t, s.day? s.id : null, introP);
  med.style.opacity=medIn; med.style.transform=`scale(${0.92+0.08*medIn})`;
  let oh='';
  if(isDay){const p=eo((t-s.start+0.15)/0.7); oh=orbHTML(s.id,p,t);}
  document.getElementById('orbs').innerHTML=oh;
  // day title with highlighted planet root
  const ttl=document.getElementById('dayttl'), sub=document.getElementById('daysub');
  if(isDay){
    const k=s.root.length;
    ttl.innerHTML=[...s.day].map((c,j)=>{const p=eo((t-s.start-0.05-j*0.045)/0.5);
      return `<span class="gold" style="opacity:${p*(j<k?1:.42)};transform:translateY(${(1-p)*22}px);filter:blur(${(1-p)*6}px)${j<k?' drop-shadow(0 0 20px rgba(255,220,150,.8))':''}">${c}</span>`}).join('');
    document.getElementById('ttlbg').style.opacity=eo((t-s.start)/0.5);const ps=eo((t-s.start-0.6)/0.6); sub.textContent=s.sub; sub.style.opacity=ps; sub.style.transform=`translateY(${(1-ps)*14}px)`;
  } else { ttl.innerHTML=''; sub.style.opacity=0; document.getElementById('ttlbg').style.opacity=0; }
  // progress glyphs
  document.querySelectorAll('#prog span').forEach((el,j)=>{const k=el.dataset.k, cur=ORDER.indexOf(s.id);
    el.style.opacity = !isDay ? 0 : (k===s.id?1:(j<cur?.6:.28));
    el.style.color = k===s.id?'#fff4d0':'#f3c873'; el.style.textShadow = k===s.id?'0 0 14px #f3c873':'none';});
  // captions: word-by-word
  const g=groups.find(g=>t>=g.t0-0.08 && t<g.t1);
  const cap=document.getElementById('cap'); cap.style.top=(isDay?1150:1180)+'px';
  cap.innerHTML = g ? g.words.map(w=>{const on=t>=w.t-0.05, act=on&&!g.words.some(v=>v.t>w.t&&t>=v.t-0.05);
    const p=eo((t-w.t+0.12)/0.22);
    return `<span style="opacity:${on?1:.0};transform:translateY(${(1-p)*10}px);color:${act?'#f6cf7e':'#fff4e6'};${act?'text-shadow:0 0 20px rgba(246,207,126,.75),0 3px 6px rgba(20,8,30,.9)':''}">${w.w}</span>`}).join('') : '';
  // end card synced to signature sting
  const e=eo((t-SND.sig_start-0.2)/0.9), end=document.getElementById('end'); end.style.opacity=e;
  const hit=t-SND.sig_hit;
  document.getElementById('pp').style.transform=`scale(${0.85+0.15*e+(hit>0&&hit<0.6?0.04*Math.sin(hit/0.6*Math.PI):0)})`;
  ['endname','endtag','endcta'].forEach((id,j)=>{const p=eo((t-SND.sig_hit-0.1-j*0.35)/0.6);const el=document.getElementById(id);el.style.opacity=p;el.style.transform=`translateY(${(1-p)*16}px)`});
  if(e>0){cap.innerHTML='';document.getElementById('medal').style.opacity=0}
  document.getElementById('turb').setAttribute('seed', Math.floor(t*24)%50);
};
</script></body></html>
